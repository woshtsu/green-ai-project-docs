ans-serif" font-size="14" lengthAdjust="spacing" textLength="132.2754" x="77" y="186.6426">POST /v1/predictions</text></g><!--entity pred_out--><g class="entity" data-entity="pred_out" data-source-line="36" data-uid="ent0013" id="entity_pred_out"><rect fill="#DBEAFE" height="72.8281" rx="6" ry="6" style="stroke:#64748B;stroke-width:0.5;" width="307.9434" x="372" y="694.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="215.4824" x="382" y="719.4238">INTEGRACIONES ACTUALES [C]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="287.9434" x="382" y="737.0332">load_selected_model / joblib / metadata JSON</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="177.4541" x="382" y="754.6426">model.predict / adapt_output</text></g><g class="entity" data-entity="GMN18" data-source-line="41" data-uid="ent0019" id="entity_GMN18"><path d="M343.5,824.8906 L343.5,875.7188 A6,6 0 0 0 349.5,881.7188 L702.1221,881.7188 A6,6 0 0 0 708.1221,875.7188 L708.1221,828.8906 L698.1221,818.8906 L530,818.8906 L526,768.1306 L522,818.8906 L349.5,818.8906 A6,6 0 0 0 343.5,824.8906" fill="#FFF7ED" style="stroke:#FDBA74;stroke-width:0.5;"/><path d="M698.1221,818.8906 L698.1221,825.8906 A3,3 0 0 0 701.1221,828.8906 L708.1221,828.8906 L698.1221,818.8906" fill="#FFF7ED" style="stroke:#FDBA74;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="287.916" x="349.5" y="838.4238">Hoy la inferencia carga archivos directamente.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="343.6221" x="349.5" y="856.0332">Hex&#225;gono = separaci&#243;n objetivo, no pureza ya lograda.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="245.1504" x="349.5" y="873.6426">Sin acceso a Prometheus ni Supabase.</text><